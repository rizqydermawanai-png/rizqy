<!DOCTYPE html>
<html>
<head>
    <title>Toko Fashion Modern</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f0f2f5; }
        .header { background-color: #fff; padding: 10px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav { display: flex; gap: 20px; }
        .nav a { text-decoration: none; color: #333; font-weight: 500; }
        .nav .shop-menu { position: relative; }
        .nav .mega-menu { display: none; position: absolute; left: 0; top: 100%; background-color: white; border: 1px solid #ddd; padding: 20px; width: max-content; }
        .nav .shop-menu:hover .mega-menu { display: block; }
        .mega-menu-content { display: flex; gap: 40px; }
        .mega-menu-column { display: flex; flex-direction: column; gap: 10px; }
        .mega-menu-column h4 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
        .mega-menu-column a { color: #666; text-decoration: none; }
        .mega-menu-column a:hover { color: #000; }
        .auth-buttons button { margin-left: 10px; padding: 8px 15px; border: none; background-color: #007bff; color: white; border-radius: 5px; cursor: pointer; }
        .auth-buttons button.logout { background-color: #dc3545; }
        main { padding: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background-color: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .product-card img { width: 100%; height: auto; }
        .product-card-content { padding: 15px; }
        .product-card h3 { font-size: 18px; margin: 0 0 10px; }
        .product-card p { font-size: 16px; font-weight: bold; color: #007bff; }
        .admin-panel { background-color: #fff; padding: 20px; margin-top: 20px; border-radius: 8px; }
        .admin-panel h2 { margin-top: 0; }
        .admin-form, .admin-table { margin-top: 15px; }
        .admin-form input, .admin-form button { padding: 8px; margin-right: 10px; }
        .admin-table table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .admin-table th { background-color: #f2f2f2; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 5px; }
        .form-success-message { position: fixed; bottom: 20px; right: 20px; background-color: #28a745; color: white; padding: 15px; border-radius: 5px; }
        .delete-icon { cursor: pointer; color: red; font-weight: bold; }
        .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; color: white; }
        .status-on { background-color: #28a745; }
        .status-off { background-color: #6c757d; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // =============== DUMMY DATA ===============
        const initialProducts = [
            { id: 1, name: "T-Shirt Grafis", price: 150000, category: "Tops", image: "https://via.placeholder.com/300x300.png?text=T-Shirt", showInMenu: true },
            { id: 2, name: "Jeans Slim-Fit", price: 450000, category: "Bottoms", image: "https://via.placeholder.com/300x300.png?text=Jeans", showInMenu: true },
            { id: 3, name: "Sneakers Kanvas", price: 350000, category: "Shoes", image: "https://via.placeholder.com/300x300.png?text=Sneakers", showInMenu: true },
            { id: 4, name: "Jaket Bomber", price: 550000, category: "Outerwear", image: "https://via.placeholder.com/300x300.png?text=Jacket", showInMenu: true },
            { id: 5, name: "Topi Baseball", price: 120000, category: "Accessories", image: "https://via.placeholder.com/300x300.png?text=Cap", showInMenu: false },
            { id: 6, name: "Celana Chino", price: 320000, category: "Bottoms", image: "https://via.placeholder.com/300x300.png?text=Chinos", showInMenu: false },
        ];

        const initialSiteContent = {
            categoryShowcase: [
                { id: 1, title: 'New Arrivals', items: ['Tops', 'Bottoms'] },
                { id: 2, title: 'Best Sellers', items: ['Shoes', 'Accessories'] }
            ]
        };

        // =============== HELPER COMPONENTS ===============
        const FormSuccessMessage = ({ onClose }) => {
            React.useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            return <div className="form-success-message">Data berhasil diperbarui!</div>;
        };

        // =============== HEADER & NAVIGATION ===============
        const Header = ({ setView, setModalView, cart, currentUser, handleLogout, siteContent, products }) => {
            const featuredProducts = products.filter(p => p.showInMenu).slice(0, 4);

            return (
                <header className="header">
                    <div className="logo">FASHION STORE</div>
                    <nav className="nav">
                        <a href="#" onClick={() => setView('home')}>Home</a>
                        <div className="shop-menu">
                            <a href="#" onClick={() => setView('products')}>Shop</a>
                            <div className="mega-menu">
                                <div className="mega-menu-content">
                                    <div className="mega-menu-column">
                                        <h4>Featured Products</h4>
                                        {featuredProducts.map(p => <a key={p.id} href="#">{p.name}</a>)}
                                    </div>
                                    {siteContent.categoryShowcase.map(showcase => (
                                        <div key={showcase.id} className="mega-menu-column">
                                            <h4>{showcase.title}</h4>
                                            {showcase.items.map(item => <a key={item} href="#">{item}</a>)}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <a href="#">About</a>
                        <a href="#">Contact</a>
                        {currentUser && currentUser.role === 'admin' && <a href="#" onClick={() => setView('admin')}>Admin Panel</a>}
                    </nav>
                    <div className="auth-buttons">
                        {currentUser ? (
                            <button className="logout" onClick={handleLogout}>Logout</button>
                        ) : (
                            <React.Fragment>
                                <button onClick={() => setModalView('login')}>Login</button>
                                <button onClick={() => setModalView('register')}>Register</button>
                            </React.Fragment>
                        )}
                    </div>
                </header>
            );
        };

        // =============== PAGE COMPONENTS ===============
        const HomePage = ({ products }) => (
            <div>
                <h1>Welcome to our Store!</h1>
                <ProductGrid products={products} />
            </div>
        );

        const ProductGrid = ({ products }) => (
            <div className="product-grid">
                {products.map(product => <ProductCard key={product.id} product={product} />)}
            </div>
        );

        const ProductCard = ({ product }) => (
            <div className="product-card">
                <img src={product.image} alt={product.name} />
                <div className="product-card-content">
                    <h3>{product.name}</h3>
                    <p>Rp {product.price.toLocaleString()}</p>
                </div>
            </div>
        );

        // =============== ADMIN PANEL COMPONENTS ===============
        const AdminPanel = ({ products, setProducts, siteContent, setSiteContent, showSuccessMessage, setShowSuccessMessage }) => {
            return (
                <div className="admin-panel">
                    <h2>Admin Panel</h2>
                    <AdminProductList products={products} setProducts={setProducts} setShowSuccessMessage={setShowSuccessMessage} />
                    <AdminCategoryShowcase siteContent={siteContent} setSiteContent={setSiteContent} setShowSuccessMessage={setShowSuccessMessage} />
                </div>
            );
        };

        const AdminProductList = ({ products, setProducts, setShowSuccessMessage }) => {
            const [editingProduct, setEditingProduct] = React.useState(null);

            const handleUpdateProduct = (e) => {
                e.preventDefault();
                const updatedProducts = products.map(p => p.id === editingProduct.id ? editingProduct : p);
                setProducts(updatedProducts);
                setEditingProduct(null);
                setShowSuccessMessage(true);
            };

            const handleCheckboxChange = (productId, checked) => {
                const updatedProducts = products.map(p =>
                    p.id === productId ? { ...p, showInMenu: checked } : p
                );
                setProducts(updatedProducts);
                setShowSuccessMessage(true);
            };

            return (
                <div className="admin-section">
                    <h3>Manage Products</h3>
                    {editingProduct && (
                        <div className="modal">
                            <div className="modal-content">
                                <form onSubmit={handleUpdateProduct}>
                                    <h4>Edit Product</h4>
                                    <input type="text" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} placeholder="Name" />
                                    <input type="number" value={editingProduct.price} onChange={e => setEditingProduct({...editingProduct, price: parseInt(e.target.value)})} placeholder="Price" />
                                    <input type="text" value={editingProduct.category} onChange={e => setEditingProduct({...editingProduct, category: e.target.value})} placeholder="Category" />
                                    <label>
                                        <input type="checkbox" checked={editingProduct.showInMenu} onChange={e => setEditingProduct({...editingProduct, showInMenu: e.target.checked})} />
                                        Show in Menu
                                    </label>
                                    <button type="submit">Update</button>
                                    <button type="button" onClick={() => setEditingProduct(null)}>Cancel</button>
                                </form>
                            </div>
                        </div>
                    )}
                    <div className="admin-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Category</th>
                                    <th>Show in Menu</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {products.map(p => (
                                    <tr key={p.id}>
                                        <td>{p.id}</td>
                                        <td>{p.name}</td>
                                        <td>{p.price}</td>
                                        <td>{p.category}</td>
                                        <td>
                                            <input type="checkbox" checked={p.showInMenu} onChange={(e) => handleCheckboxChange(p.id, e.target.checked)} />
                                            <span className={`status-badge ${p.showInMenu ? 'status-on' : 'status-off'}`}>
                                                {p.showInMenu ? 'On' : 'Off'}
                                            </span>
                                        </td>
                                        <td><button onClick={() => setEditingProduct(p)}>Edit</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const AdminCategoryShowcase = ({ siteContent, setSiteContent, setShowSuccessMessage }) => {
            const [newShowcase, setNewShowcase] = React.useState({ title: '', items: '' });

            const handleAddShowcase = (e) => {
                e.preventDefault();
                const newShowcaseItem = {
                    id: Date.now(),
                    title: newShowcase.title,
                    items: newShowcase.items.split(',').map(s => s.trim()),
                };
                setSiteContent({
                    ...siteContent,
                    categoryShowcase: [...siteContent.categoryShowcase, newShowcaseItem]
                });
                setNewShowcase({ title: '', items: '' });
                setShowSuccessMessage(true);
            };

            const removeShowcase = (id) => {
                const updatedShowcases = siteContent.categoryShowcase.filter(sc => sc.id !== id);
                setSiteContent({ ...siteContent, categoryShowcase: updatedShowcases });
                setShowSuccessMessage(true);
            };

            return (
                <div className="admin-section">
                    <h3>Manage Category Display</h3>
                    <form className="admin-form" onSubmit={handleAddShowcase}>
                        <input type="text" value={newShowcase.title} onChange={e => setNewShowcase({...newShowcase, title: e.target.value})} placeholder="Showcase Title" required/>
                        <input type="text" value={newShowcase.items} onChange={e => setNewShowcase({...newShowcase, items: e.target.value})} placeholder="Categories (comma-separated)" required/>
                        <button type="submit">Add Showcase</button>
                    </form>
                    <div className="admin-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Categories</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {siteContent.categoryShowcase.map(sc => (
                                    <tr key={sc.id}>
                                        <td>{sc.title}</td>
                                        <td>{sc.items.join(', ')}</td>
                                        <td><span className="delete-icon" onClick={() => removeShowcase(sc.id)}>X</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // =============== AUTHENTICATION MODAL ===============
        const AuthModal = ({ view, setModalView, handleLogin }) => {
            if (!view) return null;
            return (
                <div className="modal">
                    <div className="modal-content">
                        <h2>{view === 'login' ? 'Login' : 'Register'}</h2>
                        <form onSubmit={(e) => { e.preventDefault(); handleLogin({ role: 'admin' }); }}>
                            <input type="text" placeholder="Username" required />
                            <input type="password" placeholder="Password" required />
                            <button type="submit">{view === 'login' ? 'Login' : 'Register'}</button>
                        </form>
                        <button onClick={() => setModalView(null)}>Close</button>
                    </div>
                </div>
            );
        };

        // =============== FOOTER ===============
        const Footer = () => (
            <footer style={{ textAlign: 'center', padding: '20px', background: '#fff', borderTop: '1px solid #ddd', marginTop: '20px' }}>
                <p>&copy; 2024 Fashion Store. All rights reserved.</p>
            </footer>
        );

        // =============== MAIN APP COMPONENT ===============
        function App() {
            const [view, setView] = React.useState('home'); // home, products, admin
            const [modalView, setModalView] = React.useState(null); // login, register
            const [products, setProducts] = React.useState(initialProducts);
            const [siteContent, setSiteContent] = React.useState(initialSiteContent);
            const [cart, setCart] = React.useState([]);
            const [currentUser, setCurrentUser] = React.useState(null);
            const [showSuccessMessage, setShowSuccessMessage] = React.useState(false);

            const handleLogin = (user) => {
                setCurrentUser(user);
                setModalView(null);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setView('home');
            };

            const handleSetView = (newView) => {
                // Prevent non-admins from accessing the admin page
                if (newView === 'admin' && (!currentUser || currentUser.role !== 'admin')) {
                    setModalView('login'); // or show a message
                    return;
                }
                setView(newView);
            };

            const renderPage = () => {
                switch (view) {
                    case 'admin':
                        return <AdminPanel products={products} setProducts={setProducts} siteContent={siteContent} setSiteContent={setSiteContent} showSuccessMessage={showSuccessMessage} setShowSuccessMessage={setShowSuccessMessage} />;
                    case 'products':
                        return <ProductGrid products={products} />;
                    case 'home':
                    default:
                        return <HomePage products={products} />;
                }
            };

            return (
                React.createElement('div', null,
                    React.createElement(Header, { setView: handleSetView, setModalView, cart, currentUser, handleLogout, siteContent, products: products }),
                    React.createElement('main', null, renderPage()),
                    React.createElement(Footer, null),
                    React.createElement(AuthModal, { view: modalView, setModalView, handleLogin }),
                    showSuccessMessage && React.createElement(FormSuccessMessage, { onClose: () => setShowSuccessMessage(false) })
                )
            );
        }

        // Render the main App component into the root element
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
