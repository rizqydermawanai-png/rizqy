<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - KAZUMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Montserrat', sans-serif; }
        .nav-link { text-decoration: none; color: #333; font-weight: 500; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-link:hover { color: #6D4C41; }
        .dropdown-link { display: block; padding: 8px 16px; color: #333; font-size: 14px; transition: all 0.3s; }
        .dropdown-link:hover { background-color: #F5F5F5; color: #6D4C41; }
        .btn { display: inline-block; padding: 12px 30px; text-decoration: none; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
    </style>
</head>
<body class="font-sans text-[#333] bg-white">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-5">
            <div class="flex justify-between items-center py-4">
                <a href="../index.html" class="font-serif text-3xl font-bold text-[#6D4C41]">KAZUMI</a>
                <nav class="hidden md:flex">
                    <ul class="flex items-center space-x-6">
                        <li><a href="../index.html" class="nav-link">Home</a></li>
                        <li class="relative group">
                            <a href="#" class="nav-link flex items-center gap-2">
                                Shop
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                                </svg>
                            </a>
                            <ul id="category-dropdown" class="absolute left-0 top-full mt-2 w-48 bg-white shadow-lg rounded-md py-2 opacity-0 group-hover:opacity-100 transition-opacity invisible group-hover:visible">
                                <!-- Dynamic categories -->
                            </ul>
                        </li>
                        <li><a href="../koleksi.html" class="nav-link">Collections</a></li>
                        <li><a href="../pesanan-kustom.html" class="nav-link">Custom Order</a></li>
                        <li><a href="../fitting.html" class="nav-link">Fitting</a></li>
                    </ul>
                </nav>
                <div class="flex items-center space-x-5">
                    <button class="text-[#6D4C41] hover:text-[#4E342E] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                        </svg>
                    </button>
                    <a href="../keranjang.html" class="relative text-[#6D4C41] hover:text-[#4E342E] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.658-.463 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                        </svg>
                        <span id="cart-icon-badge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                    </a>
                    <a href="../login.html" class="text-[#6D4C41] hover:text-[#4E342E] transition-colors">
                       <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                       </svg>
                    </a>
                    <a href="../admin/index.html" class="admin-btn-header hidden md:flex items-center gap-2 bg-[#6D4C41] text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-[#4E342E] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
                        </svg>
                        Admin
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main id="product-detail-container">
        <!-- Product details will be injected here by JavaScript -->
    </main>

    <!-- Footer -->
    <footer id="contact" class="bg-[#4E342E] text-white pt-16 pb-8">
        <!-- Footer content is standard, can be left as is -->
    </footer>

    <script src="../data.js"></script>
    <script src="../cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('product-detail-container');
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            const products = JSON.parse(localStorage.getItem('kazumiProducts'));
            const product = products.find(p => p.id === productId);

            if (!product) {
                container.innerHTML = '<p class="text-center py-20">Produk tidak ditemukan.</p>';
                document.title = 'Produk Tidak Ditemukan - KAZUMI';
                return;
            }

            document.title = `${product.name} - KAZUMI`;

            // Render Product Details
            let sizeButtonsHTML = product.sizes.map((size, index) =>
                `<button data-size="${size}" class="size-btn w-12 h-12 border rounded-md transition-colors ${index === 0 ? 'bg-[#4E342E] text-white' : 'bg-white hover:bg-gray-100'}">${size}</button>`
            ).join('');

            let thumbnailHTML = product.images.map((img, index) =>
                `<img src="${img}" alt="Thumbnail ${index+1}" class="w-full h-24 object-cover rounded-md cursor-pointer border-2 ${index === 0 ? 'border-[#6D4C41]' : 'border-transparent hover:border-[#6D4C41]'}" onclick="changeImage(this.src)">`
            ).join('');

            container.innerHTML = `
                <div class="py-20 bg-white">
                    <div class="container mx-auto px-5">
                        <div class="grid md:grid-cols-2 gap-10">
                            <div>
                                <img id="main-image" src="${product.image}" alt="${product.name}" class="w-full h-auto max-h-[500px] object-cover rounded-lg shadow-lg mb-4"/>
                                <div class="grid grid-cols-4 gap-4">
                                    ${thumbnailHTML}
                                </div>
                            </div>
                            <div>
                                <a href="template.html?name=${product.category}" class="text-sm uppercase text-gray-500 hover:text-black">${product.category}</a>
                                <h1 class="font-serif text-4xl font-bold my-3 text-[#4E342E]">${product.name}</h1>
                                <p class="text-2xl font-semibold text-[#6D4C41] mb-4">IDR ${product.price.toLocaleString('id-ID')}</p>
                                <p class="text-gray-600 mb-6">${product.description}</p>

                                <div class="mb-6">
                                    <h3 class="font-semibold mb-2">Pilih Ukuran:</h3>
                                    <div id="size-selector" class="flex gap-2">
                                        ${sizeButtonsHTML}
                                    </div>
                                </div>

                                <button id="add-to-cart-btn" class="w-full btn bg-[#6D4C41] hover:bg-[#4E342E] text-white flex items-center justify-center gap-2 shadow-lg hover:shadow-xl transition-shadow">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                       <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.658-.463 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                                    </svg>
                                     Tambah ke Keranjang
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Add interactivity
            const sizeSelector = document.getElementById('size-selector');
            const addToCartBtn = document.getElementById('add-to-cart-btn');
            let selectedSize = product.sizes[0]; // Default size

            sizeSelector.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    selectedSize = e.target.dataset.size;
                    document.querySelectorAll('.size-btn').forEach(btn => {
                        btn.classList.remove('bg-[#4E342E]', 'text-white');
                        btn.classList.add('bg-white', 'hover:bg-gray-100');
                    });
                    e.target.classList.add('bg-[#4E342E]', 'text-white');
                    e.target.classList.remove('bg-white', 'hover:bg-gray-100');
                }
            });

            addToCartBtn.addEventListener('click', () => {
                if (!selectedSize) {
                    alert('Please select a size.');
                    return;
                }
                addToCart(product.id, product.name, product.price, product.image, selectedSize);
            });
        });

        function changeImage(src) {
            document.getElementById('main-image').src = src;
            const thumbnails = document.querySelectorAll('.grid-cols-4 img');
            thumbnails.forEach(thumb => {
                thumb.classList.remove('border-[#6D4C41]');
                thumb.classList.add('border-transparent');
                if (thumb.src === src) {
                    thumb.classList.add('border-[#6D4C41]');
                    thumb.classList.remove('border-transparent');
                }
            });
        }
    </script>
</body>
</html>
