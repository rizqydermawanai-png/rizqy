      .form-label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; }
      .form-input {
          width: 100%;
          margin-top: 4px;
          padding: 8px 12px;
          background-color: white;
          border: 1px solid #D1D5DB;
          border-radius: 6px;
          box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
          outline: none;
          transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-input:focus {
          border-color: #6D4C41;

          const calculateSize = () => {
              const h = parseInt(height);
              const w = parseInt(weight);
              if (isNaN(h) || isNaN(w) || h <= 0 || w <= 0) {
                  setRecommendation({ error: "Silakan masukkan tinggi dan berat badan yang valid." });
                  return;
              }
              let tShirtSize, shirtSize, pantsSize, jacketSize;
              if (h < 165) {
                  tShirtSize = 'S';
                  shirtSize = 'S';
              } else if (h >= 165 && h < 175) {
                  if (w < 70) {
                      tShirtSize = 'M';
                      shirtSize = 'M';
                  } else {
                      tShirtSize = 'L';
                      shirtSize = 'L';
                  }
              } else if (h >= 175 && h < 185) {
                  if (w < 80) {
                      tShirtSize = 'L';
                      shirtSize = 'L';
                  } else {
                      tShirtSize = 'XL';
                      shirtSize = 'XL';
                  }
              } else {
                  tShirtSize = 'XL';
                  shirtSize = 'XL';
              }
              if (w < 60) {
                  pantsSize = '28-30';
              } else if (w >= 60 && w < 75) {
                  pantsSize = '30-32';
              } else if (w >= 75 && w < 90) {
                  pantsSize = '33-35';
              } else {
                  pantsSize = '36+';
              }
              jacketSize = shirtSize;
              setRecommendation({ tShirtSize, shirtSize, pantsSize, jacketSize, error: null });
          };
          const handleSubmit = (e) => {
              e.preventDefault();
              calculateSize();
          };

                      </table>
                  </div>
                   {modalOpen && (<div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center"><div className="bg-white rounded-lg shadow-xl p-8 w-full max-w-md text-black"><div className="flex justify-between items-center mb-4"><h3 className="text-2xl font-bold font-serif">{productToEdit ? 'Edit Produk' : 'Tambah Produk Baru'}</h3><button onClick={() => setModalOpen(false)}><IconX /></button></div><ProductForm onSubmit={handleProductSubmit} product={productToEdit} categories={categories} collections={collections} /></div></div>)}
              </div>
          );
      };
      const AdminCollections = ({ products, setProducts, collections }) => {
          const handleCollectionChange = (productId, collection) => {
              setProducts(products.map(p => p.id === productId ? { ...p, specialCollection: collection === "None" ? null : collection } : p));
          };
          return(
               <div>
                  <h3 className="font-serif text-2xl font-bold mb-4">Kelola Koleksi Spesial</h3>
                  <div className="overflow-x-auto">
                      <table className="w-full text-left">
                          <thead>
                              <tr className="bg-gray-100"><th className="p-2">Nama Produk</th><th className="p-2">Koleksi Saat Ini</th><th className="p-2">Ganti Koleksi</th></tr>
                          </thead>
                          <tbody>
                              {products.map(p => (
                                  <tr key={p.id} className="border-b">
                                      <td className="p-2">{p.name}</td>
                                      <td className="p-2">{p.specialCollection || 'Tidak ada'}</td>
                                      <td className="p-2">
                                           <select value={p.specialCollection || "None"} onChange={(e) => handleCollectionChange(p.id, e.target.value)} className="form-input !mt-0 !text-sm !py-1">
                                               <option>None</option>
                                               {Object.keys(collections).map(key => <option key={key} value={key}>{key}</option>)}
                                           </select>
                                      </td>
                                  </tr>
                              ))}
                          </tbody>
                      </table>
                  </div>
              </div>
          );
      };
      const AdminMenu = ({ navLinks, setNavLinks }) => {
          const [isEditing, setIsEditing] = React.useState(false);
          const [currentLink, setCurrentLink] = React.useState({ id: '', text: '', view: '', param: '' });
          const handleInputChange = (e) => {
              const { name, value } = e.target;
              setCurrentLink(prev => ({ ...prev, [name]: value }));
          };
          const handleSubmit = (e) => {
              e.preventDefault();
              if (isEditing) {
                  setNavLinks(navLinks.map(link => link.id === currentLink.id ? currentLink : link));
              } else {
                  setNavLinks([...navLinks, { ...currentLink, id: Date.now().toString() }]);
              }
              resetForm();
          };
          const editLink = (link) => {
              setIsEditing(true);
              setCurrentLink(link);
          };
          const deleteLink = (id) => {
              setNavLinks(navLinks.filter(link => link.id !== id));
          };
          const resetForm = () => {
              setIsEditing(false);
              setCurrentLink({ id: '', text: '', view: '', param: '' });
          };
          return (
              <div>
                  <h3 className="font-serif text-2xl font-bold mb-4">Kelola Menu Navigasi</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      <div>
                          <h4 className="font-semibold mb-2">{isEditing ? 'Edit Link' : 'Tambah Link Baru'}</h4>
                          <form onSubmit={handleSubmit} className="space-y-3 bg-gray-50 p-4 rounded-md">
                              <div><label className="form-label">Teks Link</label><input type="text" name="text" value={currentLink.text} onChange={handleInputChange} className="form-input" required /></div>
                              <div><label className="form-label">View Tujuan</label><input type="text" name="view" value={currentLink.view} onChange={handleInputChange} className="form-input" placeholder="cth: category" required /></div>
                              <div><label className="form-label">Parameter (Opsional)</label><input type="text" name="param" value={currentLink.param} onChange={handleInputChange} className="form-input" placeholder="cth: T-Shirt" /></div>
                              <div className="flex gap-2">
                                  <button type="submit" className="btn bg-[#6D4C41] hover:bg-[#4E342E] text-white !py-2">{isEditing ? 'Simpan Perubahan' : 'Tambah Link'}</button>
                                  {isEditing && <button type="button" onClick={resetForm} className="btn bg-gray-300 hover:bg-gray-400 text-black !py-2">Batal</button>}
                              </div>
                          </form>
                      </div>
                      <div>
                          <h4 className="font-semibold mb-2">Urutan Menu Saat Ini</h4>
                          <ul className="space-y-2">
                              {navLinks.map(link => (
                                  <li key={link.id} className="flex items-center justify-between bg-white p-2 rounded-md shadow-sm">
                                      <span>{link.text} <span className="text-xs text-gray-500">({link.view})</span></span>
                                      <div className="flex gap-2">
                                          <button onClick={() => editLink(link)} className="text-blue-600 hover:text-blue-800 p-1"><IconEdit /></button>
                                          <button onClick={() => deleteLink(link.id)} className="text-red-600 hover:text-red-800 p-1"><IconTrash /></button>
                                      </div>
                                  </li>
                              ))}
                          </ul>
                      </div>
                  </div>
              </div>
          );
      };

      // =========== MAIN APP ===========
      function App() {
          const [view, setView] = React.useState({ page: 'home', param: null });
          const [adminView, setAdminView] = React.useState('dashboard');
          const [modalView, setModalView] = React.useState(null);
          const [showSuccessMessage, setShowSuccessMessage] = React.useState(false);
          const [products, setProducts] = React.useState(INITIAL_PRODUCTS);
          const [promos, setPromos] = React.useState([{ id: 1, title: "KAZUMI x BUSINESSWEEK", subtitle: "MONDAY SPECIAL", offer: "BUY 2 GET 30% OFF", terms: "Groups IDR 8.000 dengan min. pembelian IDR 300.000" }]);
          const [cart, setCart] = React.useState([]);
          const [currentUser, setCurrentUser] = React.useState(null);
          const [navLinks, setNavLinks] = React.useState([
              { id: 'home', text: 'Home', view: 'home' },
              { id: 'shop', text: 'Shop', view: 'category', param: 'T-Shirt', dropdown: true },
              { id: 'special-collections', text: 'Collections', view: 'special-collections' },
              { id: 'custom-order', text: 'Custom Order', view: 'custom-order' },
              { id: 'fitting-guide', text: 'Fitting Guide', view: 'fitting-guide' },
          ]);

          const handleSetView = (page, param = null) => {
              setView({ page, param });
              window.scrollTo(0, 0);
          };

          const handleSetAdminView = (page) => {
              setAdminView(page);
          };

          const handleOrderSubmit = () => { setShowSuccessMessage(true); };

          const handleLogin = (user) => { setCurrentUser(user); };
          const handleLogout = () => { setCurrentUser(null); };

          const addToCart = (product, selectedSize) => {
              setCart(prevCart => {
                  const existingItem = prevCart.find(item => item.id === product.id && item.selectedSize === selectedSize);
                  if (existingItem) {
                      return prevCart.map(item =>
                          item.id === product.id && item.selectedSize === selectedSize
                              ? { ...item, quantity: item.quantity + 1 }
                              : item
                      );
                  }
                  return [...prevCart, { ...product, selectedSize, quantity: 1 }];
              });
              handleSetView('cart');
          };

          const renderPage = () => {
              const page = view.page;
              if (page.startsWith('admin')) {
                   const renderAdminContent = () => {
                      switch(adminView) {
                          case 'products': return <AdminProducts products={products} setProducts={setProducts} categories={CATEGORIES} collections={SPECIAL_COLLECTIONS} />;
                          case 'collections': return <AdminCollections products={products} setProducts={setProducts} collections={SPECIAL_COLLECTIONS} />;
                          case 'menu': return <AdminMenu navLinks={navLinks} setNavLinks={setNavLinks} />;
                          case 'dashboard':
                          default:
                              return <AdminDashboard products={products} promos={promos} />;
                      }
                  };
                  return (
                      <AdminLayout setView={handleSetView} adminView={adminView} setAdminView={handleSetAdminView}>
                          {renderAdminContent()}
                      </AdminLayout>
                  );
              }

              switch (page) {
                  case 'category': return <CategoryPage category={view.param} products={products} setView={handleSetView} />;
                  case 'product': return <ProductDetailPage productId={view.param} products={products} setView={handleSetView} addToCart={addToCart} />;
                  case 'special-collections': return <SpecialCollectionsPage products={products} collections={SPECIAL_COLLECTIONS} />;
                  case 'custom-order': return <CustomOrderPage onOrderSubmit={handleOrderSubmit} />;
                  case 'bulk-purchase': return <BulkPurchasePage onOrderSubmit={handleOrderSubmit} />;
                  case 'login': return <LoginPage setView={handleSetView} handleLogin={handleLogin} />;
                  case 'cart': return <CartPage cart={cart} setCart={setCart} setView={handleSetView} />;
                  case 'fitting-guide': return <FittingGuidePage />;
                  case 'home':
                  default:
                      return (
                          <HomePage products={products} promos={promos} setView={handleSetView} collections={SPECIAL_COLLECTIONS} />
                      );
              }
          };

          return (
              <div className="font-sans text-[#333] bg-white">
                  <Header setView={handleSetView} setModalView={setModalView} cart={cart} currentUser={currentUser} handleLogout={handleLogout} categories={CATEGORIES} navLinks={navLinks} />
                  <main>{renderPage()}</main>
                  <Footer />
                  {showSuccessMessage && <FormSuccessMessage onClose={() => setShowSuccessMessage(false)} />}
                  {modalView === 'search' && <SearchModal products={products} setView={handleSetView} setModalView={setModalView} />}
              </div>
          );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
