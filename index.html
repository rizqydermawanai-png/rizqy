                    { name: 'Jacket', wallpaperImage: 'https://images.unsplash.com/photo-1591047139829-d919b5ca2373?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80', title: 'The Jacket Collection', subtitle: 'The perfect outer layer for any weather.', externalUrl: '#' },

                            { id: 'tshirt-oversize-box', label: 'Oversize Box', type: 'internal', target: 'sub-category', param: 'Oversize Box', isVisible: true },
                        ]},
                        { id: 'shirt', label: 'Shirt', type: 'nested-dropdown', isVisible: true, children: [
                            { id: 'shirt-slim-fit', label: 'Slim Fit', type: 'internal', target: 'sub-category', param: 'Slim Fit', isVisible: true },
                            { id: 'shirt-regular-fit', label: 'Regular Fit', type: 'internal', target: 'sub-category', param: 'Regular Fit', isVisible: true },
                            { id: 'shirt-flannel', label: 'Flannel', type: 'internal', target: 'sub-category', param: 'Flannel', isVisible: true },
                        ]},
                        { id: 'pants', label: 'Pants', type: 'nested-dropdown', isVisible: true, children: [
                            { id: 'pants-chino', label: 'Chino', type: 'internal', target: 'sub-category', param: 'Chino', isVisible: true },
                            { id: 'pants-jeans', label: 'Jeans', type: 'internal', target: 'sub-category', param: 'Jeans', isVisible: true },

                            { id: 'jacket-leather', label: 'Leather', type: 'internal', target: 'sub-category', param: 'Leather', isVisible: true },
                        ]},
                        { id: 'accessories', label: 'Accessories', type: 'internal', target: 'category', param: 'Accessories', isVisible: true, icon: null },

                    { id: 'collections', label: 'Collections', type: 'internal', target: 'special-collections', isVisible: true, icon: null },
                    { id: 'fitting-room', label: 'Fitting Room', type: 'internal', target: 'fitting-room', isVisible: true, icon: null },
                    { id: 'custom-order', label: 'Custom Order', type: 'internal', target: 'custom-order', isVisible: false, icon: null },
                    { id: 'order-tracking', label: 'Lacak Pesanan', type: 'internal', target: 'order-tracking', isVisible: true, icon: null },
                ],
            };

            // Live site content
            const [siteContent, setSiteContent] = usePersistentState('kazumi-siteContent', initialSiteContent);
            // Draft content for admin panel
            const [draftSiteContent, setDraftSiteContent] = usePersistentState('kazumi-draftSiteContent', siteContent);

            // Track if there are unsaved changes
            const hasUnsavedChanges = JSON.stringify(siteContent) !== JSON.stringify(draftSiteContent);

            // Effect to sync draft content when an admin logs in
            useEffect(() => {
                if (currentUser && currentUser.role === 'admin') {
                    // When an admin logs in, reset their draft to match the live site.
                    // This ensures they don't accidentally edit a stale draft.
                    setDraftSiteContent(siteContent);
                }
            }, [currentUser]); // This effect runs whenever the user logs in or out.

            // Function to save changes
            const handleSaveChanges = () => {
                setSiteContent(draftSiteContent);
                alert('Perubahan telah disimpan dan dipublikasikan!');
            };

            // Function to discard changes
            const handleDiscardChanges = () => {
                setDraftSiteContent(siteContent);
                alert('Perubahan yang belum disimpan telah dibatalkan.');
            };

            // Handles changing the main view of the application
            const handleSetView = (page, param = null) => {
                setView({ page, param });
                window.scrollTo(0, 0); // Scroll to top on page change
            };

            // Handles changing the view within the admin panel
            const handleSetAdminView = (page) => {
                setAdminView(page);
            };

            // Callback for form submissions that should show a success message
            const handleOrderSubmit = () => { setShowSuccessMessage(true); };

            // Handles user login
            const handleLogin = (user) => {
                const existingUser = users.find(u => u.email === user.email);
                if (existingUser) {
                    if ((user.email === 'admin@kazumi.com' && user.password === 'rizqybrokol1') || (existingUser.role === 'customer')) {
                        setCurrentUser(existingUser);
                        handleSetView('home');
                    } else {
                        alert('Email atau password salah.');
                    }
                } else {
                    const newUser = { id: Date.now(), name: user.name, email: user.email, phone: user.phone, isActive: true, role: 'customer' };
                    setUsers(prevUsers => [...prevUsers, newUser]);
                    setCurrentUser(newUser);
                    handleSetView('home');
                }
            };
            // Handles user logout
            const handleLogout = () => { setCurrentUser(null); };

            // Adds a product to the cart or updates its quantity if already present
            const addToCart = (product, selectedSize) => {
                setCart(prevCart => {
                    const existingItem = prevCart.find(item => item.id === product.id && item.selectedSize === selectedSize);
                    if (existingItem) {
                        return prevCart.map(item =>
                            item.id === product.id && item.selectedSize === selectedSize
                                ? { ...item, quantity: item.quantity + 1 }
                                : item
                        );
                    }
                    return [...prevCart, { ...product, selectedSize, quantity: 1 }];
                });
                handleSetView('cart'); // Navigate to cart page after adding
            };

            // Handles placing an order from the checkout page
            const handleOrderPlaced = (orderDetails) => {
                setOrders(prevOrders => [...prevOrders, orderDetails]);
                setCart([]); // Clear cart after order is placed
            };

            // Renders the appropriate page component based on the current 'view' state
            const renderPage = () => {
                const page = view.page;
                // Admin panel routing
                if (page.startsWith('admin')) {
                    if (!currentUser || currentUser.role !== 'admin') {
                        return React.createElement('div', { className: 'py-20 text-center' }, 'Akses ditolak. Anda tidak memiliki izin untuk melihat halaman ini.', React.createElement('a', { href: '#', onClick: (e) => { e.preventDefault(); handleSetView('home'); }, className: 'text-blue-600' }, 'Kembali ke beranda.'));
                    }

                    const renderAdminContent = () => {
                        switch (adminView) {
                            case 'products': return React.createElement(AdminProducts, { products: products, setProducts: setProducts });
                            case 'collections': return React.createElement(AdminCollections, { products: products, setProducts: setProducts });
                            case 'content': return React.createElement(AdminContent, { siteContent: draftSiteContent, setSiteContent: setDraftSiteContent });
                            case 'category-display': return React.createElement(AdminCategoryShowcase, { siteContent: draftSiteContent, setSiteContent: setDraftSiteContent });
                            case 'featured-categories': return React.createElement(AdminFeaturedCategories, { siteContent: draftSiteContent, setSiteContent: setDraftSiteContent });
                            case 'promos': return React.createElement(AdminPromos, { promos: promos, setPromos: setPromos });
                            case 'orders': return React.createElement(AdminOrders, { orders: orders, setOrders: setOrders });
                            case 'payments': return React.createElement(AdminPayments, { availableBanks: availableBanks, setAvailableBanks: setAvailableBanks });
                            case 'shipping': return React.createElement(AdminShipping, { availableShippingOptions: availableShippingOptions, setAvailableShippingOptions: setAvailableShippingOptions });
                            case 'users': return React.createElement(AdminUsers, { users: users, setUsers: setUsers });
                            case 'settings': return React.createElement(AdminSettings, null);
                            case 'dashboard':
                            default:
                                return React.createElement(AdminDashboard, { products: products, promos: promos, users: users, orders: orders });
                        }
                    };
                    return (
                        React.createElement(AdminLayout, {
                            adminView: adminView,
                            setAdminView: handleSetAdminView,
                            hasUnsavedChanges: hasUnsavedChanges,
                            onSave: handleSaveChanges,
                            onDiscard: handleDiscardChanges
                        },
                            renderAdminContent()
                        )
                    );
                }

                // Frontend page routing
                switch (page) {
                    case 'sub-category': return React.createElement(SubCategoryPage, { subCategory: view.param, products: products, setView: handleSetView });
                    case 'category': return React.createElement(CategoryPage, { category: view.param, products: products, setView: handleSetView });
                    case 'product': return React.createElement(ProductDetailPage, { productId: view.param, products: products, setView: handleSetView, addToCart: addToCart });
                    case 'special-collections': return React.createElement(SpecialCollectionsPage, { products: products, siteContent: siteContent });
                    case 'custom-order': return React.createElement(CustomOrderPage, { onOrderSubmit: handleOrderSubmit });
                    case 'bulk-purchase': return React.createElement(BulkPurchasePage, { onOrderSubmit: handleOrderSubmit });
                    case 'login': return React.createElement(LoginPage, { setView: handleSetView, handleLogin: handleLogin });
                    case 'cart': return React.createElement(CartPage, { cart: cart, setCart: setCart, setView: handleSetView });
                    case 'checkout': return React.createElement(CheckoutPage, { cart: cart, setView: handleSetView, onOrderPlaced: handleOrderPlaced, availableBanks: availableBanks, availableShippingOptions: availableShippingOptions });
                    case 'order-success': return React.createElement(OrderSuccessPage, { orderDetails: view.param, setView: handleSetView });
                    case 'order-tracking': return React.createElement(OrderTrackingPage, { orders: orders });
                    case 'fitting-room': return React.createElement(FittingRoomPage, null);
                    case 'profile': return React.createElement(ProfilePage, { currentUser: currentUser, setCurrentUser: setCurrentUser, setView: handleSetView });
                    case 'home':
                    default:
                        return (
                            React.createElement(React.Fragment, null,
                                React.createElement(Hero, { setView: handleSetView, siteContent: siteContent }),
                                siteContent.featuredCategories.map(fc => React.createElement(FeaturedCategory, {
                                    key: fc.categoryName,
                                    categoryName: fc.categoryName,
                                    products: products,
                                    siteContent: siteContent,

                    React.createElement('main', null, renderPage()),

        // Render the main App component into the 'root' div
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
