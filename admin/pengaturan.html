<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Situs - KAZUMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Montserrat', sans-serif; }
        .btn { display: inline-block; padding: 10px 24px; text-decoration: none; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .form-label { display: block; text-sm font-medium text-gray-700 mb-1; }
        .form-input { display: block; width: 100%; padding: 8px 12px; background-color: white; border: 1px solid #D1D5DB; border-radius: 6px; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-input:focus { border-color: #6D4C41; box-shadow: 0 0 0 3px rgba(109, 76, 65, 0.2); }
        .form-select { display: block; width: 100%; padding: 8px 12px; background-color: white; border: 1px solid #D1D5DB; border-radius: 6px; }
        .fieldset { border: 1px solid #e5e7eb; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; }
        .legend { font-size: 1.125rem; font-weight: 600; font-family: 'Playfair Display', serif; color: #4E342E; padding: 0 0.5rem; }
    </style>
</head>
<body class="font-sans text-[#333] bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-5">
            <div class="flex justify-between items-center py-4">
                <a href="../index.html" class="font-serif text-3xl font-bold text-[#6D4C41]">KAZUMI</a>
                <a href="../index.html" class="text-sm text-gray-600 hover:text-black">Kembali ke Situs Utama</a>
            </div>
        </div>
    </header>

    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-white min-h-screen p-4 shadow-lg">
           <ul class="space-y-2">
                <li>
                    <a href="index.html" class="flex items-center gap-3 p-3 rounded-md text-gray-700 transition-colors hover:bg-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="produk.html" class="flex items-center gap-3 p-3 rounded-md text-gray-700 transition-colors hover:bg-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" /><path stroke-linecap="round" stroke-linejoin="round" d="M3.27 6.96L12 12.01l7.73-5.05M12 22.08V12" /></svg>
                        <span>Kelola Produk</span>
                    </a>
                </li>
                <li>
                    <a href="koleksi.html" class="flex items-center gap-3 p-3 rounded-md text-gray-700 transition-colors hover:bg-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M4.098 19.902a3.75 3.75 0 005.304 0l6.401-6.402a3.75 3.75 0 00-.625-6.25A3.75 3.75 0 006.75 7.5v.75m11.25 10.5a3.75 3.75 0 01-5.304 0l-6.401-6.402a3.75 3.75 0 01.625-6.25A3.75 3.75 0 0117.25 7.5v.75" />
                        </svg>
                        <span>Kelola Koleksi</span>
                    </a>
                </li>
                 <li>
                    <a href="pengaturan.html" class="flex items-center gap-3 p-3 rounded-md bg-[#6D4C41] text-white font-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" /></svg>
                        <span>Pengaturan</span>
                    </a>
                </li>
           </ul>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-10">
            <div class="max-w-4xl mx-auto">
                <h1 class="font-serif text-4xl font-bold text-[#4E342E] mb-8">Pengaturan Konten Situs</h1>
                <form id="settings-form" class="space-y-10">

                    <!-- Homepage Slider -->
                    <fieldset class="fieldset">
                        <legend class="legend">Homepage Slider</legend>
                        <div id="slider-container" class="space-y-6">
                            <!-- Slides will be rendered here by JS -->
                        </div>
                        <button type="button" id="add-slide-btn" class="btn bg-gray-200 hover:bg-gray-300 text-gray-800 mt-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                            Tambah Slide Baru
                        </button>
                    </fieldset>

                    <!-- Featured Collections -->
                    <fieldset class="fieldset">
                        <legend class="legend">Koleksi Unggulan</legend>
                        <div><label class="form-label" for="featured-title">Judul Bagian</label><input type="text" id="featured-title" class="form-input"></div>
                        <div class="mt-4"><label class="form-label">Pilih Koleksi untuk Ditampilkan:</label>
                            <div id="featured-categories-container" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-2">
                                <!-- Checkboxes will be rendered here by JS -->
                            </div>
                        </div>
                    </fieldset>

                    <!-- New Arrivals -->
                    <fieldset class="fieldset">
                        <legend class="legend">Produk Terbaru</legend>
                        <div><label class="form-label" for="new-arrivals-title">Judul Bagian</label><input type="text" id="new-arrivals-title" class="form-input"></div>
                        <div class="mt-4"><label class="form-label" for="new-arrivals-products">Pilih Produk (tahan Ctrl/Cmd untuk memilih banyak):</label>
                            <select id="new-arrivals-products" multiple class="form-input h-48">
                                <!-- Options will be rendered here by JS -->
                            </select>
                        </div>
                    </fieldset>

                    <!-- Mid-page Promo Banner -->
                    <fieldset class="fieldset">
                        <legend class="legend">Banner Promo Tengah Halaman</legend>
                        <div><label class="form-label" for="promo-title">Judul</label><input type="text" id="promo-title" class="form-input"></div>
                        <div class="mt-4"><label class="form-label" for="promo-subtitle">Sub-judul</label><input type="text" id="promo-subtitle" class="form-input"></div>
                        <div class="mt-4"><label class="form-label" for="promo-offer">Teks Penawaran</label><input type="text" id="promo-offer" class="form-input"></div>
                        <div class="mt-4">
                            <label class="form-label" for="promo-img">Gambar Latar</label>
                            <div class="flex items-center gap-4">
                                <img id="promo-image-preview" src="" class="h-16 w-32 object-cover rounded-md border">
                                <input type="file" id="promo-img" class="form-input file-input">
                            </div>
                        </div>
                    </fieldset>

                    <div class="text-right">
                        <button type="submit" class="btn bg-[#6D4C41] hover:bg-[#4E342E] text-white text-lg">Simpan Semua Perubahan</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let settings = JSON.parse(localStorage.getItem('kazumiSettings'));
            const products = JSON.parse(localStorage.getItem('kazumiProducts'));
            const mainForm = document.getElementById('settings-form');
            const sliderContainer = document.getElementById('slider-container');
            const addSlideBtn = document.getElementById('add-slide-btn');

            function renderSettings() {
                // Populate simple fields
                document.getElementById('featured-title').value = settings.featuredTitle;
                document.getElementById('new-arrivals-title').value = settings.newArrivalsTitle;
                document.getElementById('promo-title').value = settings.promoBanner.title;
                document.getElementById('promo-subtitle').value = settings.promoBanner.subtitle;
                document.getElementById('promo-offer').value = settings.promoBanner.offer;
                document.getElementById('promo-image-preview').src = settings.promoBanner.image;

                // Populate Slider
                sliderContainer.innerHTML = '';
                settings.slider.forEach((slide, index) => {
                    const slideEl = document.createElement('div');
                    slideEl.className = 'border p-4 rounded-md bg-gray-50 space-y-4 slide-form';
                    slideEl.innerHTML = `
                        <h4 class="font-bold">Slide ${index + 1}</h4>
                        <div><label class="form-label">Judul</label><input type="text" class="form-input slide-title" value="${slide.title}"></div>
                        <div><label class="form-label">Sub-judul</label><input type="text" class="form-input slide-subtitle" value="${slide.subtitle}"></div>
                        <div>
                            <label class="form-label">Gambar Latar</label>
                            <div class="flex items-center gap-4">
                                <img src="${slide.image}" class="h-16 w-32 object-cover rounded-md border slide-image-preview">
                                <input type="file" class="form-input file-input">
                            </div>
                        </div>
                        <div class="text-right"><button type="button" class="text-sm text-red-600 hover:text-red-800 font-semibold delete-slide-btn">Hapus Slide</button></div>
                    `;
                    sliderContainer.appendChild(slideEl);
                });

                // Populate Featured Categories
                const categoriesContainer = document.getElementById('featured-categories-container');
                const allCategories = [...new Set(products.map(p => p.category))];
                categoriesContainer.innerHTML = '';
                allCategories.forEach(cat => {
                    const isChecked = settings.featuredCategories.includes(cat);
                    categoriesContainer.innerHTML += `
                        <div><label class="flex items-center"><input type="checkbox" class="h-4 w-4 rounded featured-category-checkbox" value="${cat}" ${isChecked ? 'checked' : ''}> <span class="ml-2">${cat}</span></label></div>
                    `;
                });

                // Populate New Arrivals
                const newArrivalsSelect = document.getElementById('new-arrivals-products');
                newArrivalsSelect.innerHTML = '';
                products.forEach(p => {
                    const isSelected = settings.newArrivalsProductIds.includes(p.id);
                    newArrivalsSelect.innerHTML += `<option value="${p.id}" ${isSelected ? 'selected' : ''}>${p.name}</option>`;
                });
            }

            function saveSettings() {
                // Save simple fields
                settings.featuredTitle = document.getElementById('featured-title').value;
                settings.newArrivalsTitle = document.getElementById('new-arrivals-title').value;
                settings.promoBanner.title = document.getElementById('promo-title').value;
                settings.promoBanner.subtitle = document.getElementById('promo-subtitle').value;
                settings.promoBanner.offer = document.getElementById('promo-offer').value;
                settings.promoBanner.image = document.getElementById('promo-image-preview').src;

                // Save Slider
                settings.slider = [];
                document.querySelectorAll('.slide-form').forEach(slideEl => {
                    settings.slider.push({
                        title: slideEl.querySelector('.slide-title').value,
                        subtitle: slideEl.querySelector('.slide-subtitle').value,
                        image: slideEl.querySelector('.slide-image-preview').src
                    });
                });

                // Save Featured Categories
                settings.featuredCategories = [];
                document.querySelectorAll('.featured-category-checkbox:checked').forEach(cb => {
                    settings.featuredCategories.push(cb.value);
                });

                // Save New Arrivals
                settings.newArrivalsProductIds = [];
                Array.from(document.getElementById('new-arrivals-products').selectedOptions).forEach(opt => {
                    settings.newArrivalsProductIds.push(opt.value);
                });

                localStorage.setItem('kazumiSettings', JSON.stringify(settings));
                alert('Pengaturan telah disimpan!');
            }

            // Event Listeners
            mainForm.addEventListener('submit', (e) => {
                e.preventDefault();
                saveSettings();
            });

            addSlideBtn.addEventListener('click', () => {
                sliderContainer.innerHTML += `
                    <div class="border p-4 rounded-md bg-gray-50 space-y-4 slide-form">
                        <h4 class="font-bold">Slide ${sliderContainer.children.length + 1}</h4>
                        <div><label class="form-label">Judul</label><input type="text" class="form-input slide-title" value=""></div>
                        <div><label class="form-label">Sub-judul</label><input type="text" class="form-input slide-subtitle" value=""></div>
                        <div>
                            <label class="form-label">Gambar Latar</label>
                            <div class="flex items-center gap-4">
                                <img src="" class="h-16 w-32 object-cover rounded-md border bg-gray-200 slide-image-preview">
                                <input type="file" class="form-input file-input">
                            </div>
                        </div>
                        <div class="text-right"><button type="button" class="text-sm text-red-600 hover:text-red-800 font-semibold delete-slide-btn">Hapus Slide</button></div>
                    </div>
                `;
            });

            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-slide-btn')) {
                    e.target.closest('.slide-form').remove();
                }
            });

            document.addEventListener('change', (e) => {
                if (e.target.classList.contains('file-input')) {
                     const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        const previewImage = e.target.previousElementSibling;
                        reader.onload = (event) => {
                            previewImage.src = event.target.result;
                        }
                        reader.readAsDataURL(file);
                    }
                }
            });

            // Initial render
            renderSettings();
        });
    </script>
</body>
</html>
