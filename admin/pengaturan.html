<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Situs - KAZUMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Montserrat', sans-serif; }
        .btn { display: inline-block; padding: 10px 24px; text-decoration: none; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .form-label { display: block; text-sm font-medium text-gray-700 mb-1; }
        .form-input { display: block; width: 100%; padding: 8px 12px; background-color: white; border: 1px solid #D1D5DB; border-radius: 6px; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-input:focus { border-color: #6D4C41; box-shadow: 0 0 0 3px rgba(109, 76, 65, 0.2); }
        .form-select { display: block; width: 100%; padding: 8px 12px; background-color: white; border: 1px solid #D1D5DB; border-radius: 6px; }
        .fieldset { border: 1px solid #e5e7eb; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; }
        .legend { font-size: 1.125rem; font-weight: 600; font-family: 'Playfair Display', serif; color: #4E342E; padding: 0 0.5rem; }
    </style>
</head>
<body class="font-sans text-[#333] bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-5">
            <div class="flex justify-between items-center py-4">
                <a href="../index.html" class="font-serif text-3xl font-bold text-[#6D4C41]">KAZUMI</a>
                <a href="../index.html" class="text-sm text-gray-600 hover:text-black">Kembali ke Situs Utama</a>
            </div>
        </div>
    </header>

    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-white min-h-screen p-4 shadow-lg">
           <ul class="space-y-2">
                <li>
                    <a href="index.html" class="flex items-center gap-3 p-3 rounded-md text-gray-700 transition-colors hover:bg-gray-200">
                        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="produk.html" class="flex items-center gap-3 p-3 rounded-md text-gray-700 transition-colors hover:bg-gray-200">
                        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span>Kelola Produk</span>
                    </a>
                </li>
                <li>
                    <a href="koleksi.html" class="flex items-center gap-3 p-3 rounded-md text-gray-700 transition-colors hover:bg-gray-200">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                          <path stroke-linecap="round" stroke-linejoin="round" d="M4.098 19.902a3.75 3.75 0 005.304 0l6.401-6.402a3.75 3.75 0 00-.625-6.25A3.75 3.75 0 006.75 7.5v.75m11.25 10.5a3.75 3.75 0 01-5.304 0l-6.401-6.402a3.75 3.75 0 01.625-6.25A3.75 3.75 0 0117.25 7.5v.75" />
                                        </svg>
                        <span>Kelola Koleksi</span>
                    </a>
                </li>
                 <li>
                    <a href="pengaturan.html" class="flex items-center gap-3 p-3 rounded-md bg-[#6D4C41] text-white font-semibold">
                        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2"/><path d="M12 22v-2"/><path d="m17 20.66-1-1.73"/><path d="M11 10.27 7 3.34"/><path d="m20.66 17-1.73-1"/><path d="m3.34 7 1.73 1"/><path d="M14 12h8"/><path d="M2 12h2"/><path d="m20.66 7-1.73-1"/><path d="m3.34 17 1.73-1"/><path d="m17 3.34-1 1.73"/><path d="m11 13.73-4 6.93"/></svg>
                        <span>Pengaturan</span>
                    </a>
                </li>
           </ul>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-10">
            <div class="max-w-4xl mx-auto">
                <h1 class="font-serif text-4xl font-bold text-[#4E342E] mb-8">Pengaturan Konten Situs</h1>
                <form action="#" method="POST" class="space-y-10">

                    <!-- Homepage Slider -->
                    <fieldset class="fieldset">
                        <legend class="legend">Homepage Slider</legend>
                        <div id="slider-container" class="space-y-6">
                            <!-- Slide 1 -->
                            <div class="border p-4 rounded-md bg-gray-50 space-y-4">
                                <h4 class="font-bold">Slide 1</h4>
                                <div><label class="form-label" for="slide1-title">Judul</label><input type="text" id="slide1-title" class="form-input" value="ELEVATE YOUR STYLE"></div>
                                <div><label class="form-label" for="slide1-subtitle">Sub-judul</label><input type="text" id="slide1-subtitle" class="form-input" value="Discover the perfect blend of sophistication and modern fashion."></div>
                                <div>
                                    <label class="form-label" for="slide1-img">Gambar Latar</label>
                                    <div class="flex items-center gap-4">
                                        <img src="https://images.unsplash.com/photo-1617137968427-85924c800a22?ixlib=rb-4.0.3&auto=format&fit=crop&w=160&q=80" class="h-16 w-32 object-cover rounded-md border">
                                        <input type="file" id="slide1-img" class="form-input">
                                    </div>
                                </div>
                                <div class="text-right"><button type="button" class="text-sm text-red-600 hover:text-red-800 font-semibold">Hapus Slide</button></div>
                            </div>
                             <!-- Slide 2 -->
                            <div class="border p-4 rounded-md bg-gray-50 space-y-4">
                                <h4 class="font-bold">Slide 2</h4>
                                <div><label class="form-label" for="slide2-title">Judul</label><input type="text" id="slide2-title" class="form-input" value="TIMELESS COLLECTION"></div>
                                <div><label class="form-label" for="slide2-subtitle">Sub-judul</label><input type="text" id="slide2-subtitle" class="form-input" value="Crafted with passion, designed for the discerning."></div>
                                <div>
                                    <label class="form-label" for="slide2-img">Gambar Latar</label>
                                    <div class="flex items-center gap-4">
                                        <img src="https://images.unsplash.com/photo-1550928434-4a02a9534544?ixlib=rb-4.0.3&auto=format&fit=crop&w=160&q=80" class="h-16 w-32 object-cover rounded-md border">
                                        <input type="file" id="slide2-img" class="form-input">
                                    </div>
                                </div>
                                <div class="text-right"><button type="button" class="text-sm text-red-600 hover:text-red-800 font-semibold">Hapus Slide</button></div>
                            </div>
                        </div>
                        <button type="button" class="btn bg-gray-200 hover:bg-gray-300 text-gray-800 mt-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                            Tambah Slide Baru
                        </button>
                    </fieldset>

                    <!-- Featured Collections -->
                    <fieldset class="fieldset">
                        <legend class="legend">Koleksi Unggulan</legend>
                        <div><label class="form-label" for="featured-title">Judul Bagian</label><input type="text" id="featured-title" class="form-input" value="Our Collections"></div>
                        <div class="mt-4"><label class="form-label">Pilih Koleksi untuk Ditampilkan:</label>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-2">
                                <div><label class="flex items-center"><input type="checkbox" class="h-4 w-4 rounded" checked> <span class="ml-2">T-Shirt</span></label></div>
                                <div><label class="flex items-center"><input type="checkbox" class="h-4 w-4 rounded" checked> <span class="ml-2">Shirt</span></label></div>
                                <div><label class="flex items-center"><input type="checkbox" class="h-4 w-4 rounded" checked> <span class="ml-2">Pants</span></label></div>
                                <div><label class="flex items-center"><input type="checkbox" class="h-4 w-4 rounded" checked> <span class="ml-2">Jacket</span></label></div>
                                <div><label class="flex items-center"><input type="checkbox" class="h-4 w-4 rounded"> <span class="ml-2">Accessories</span></label></div>
                            </div>
                        </div>
                    </fieldset>

                    <!-- New Arrivals -->
                    <fieldset class="fieldset">
                        <legend class="legend">Produk Terbaru</legend>
                        <div><label class="form-label" for="new-arrivals-title">Judul Bagian</label><input type="text" id="new-arrivals-title" class="form-input" value="New Arrivals"></div>
                        <div class="mt-4"><label class="form-label" for="new-arrivals-products">Pilih Produk (tahan Ctrl/Cmd untuk memilih banyak):</label>
                            <select id="new-arrivals-products" multiple class="form-input h-48">
                                <option selected>Classic White T-Shirt</option>
                                <option selected>Blue Oxford Shirt</option>
                                <option>Modern Chino Pants</option>
                                <option selected>Denim Trucker Jacket</option>
                                <option>Graphic Print T-Shirt</option>
                                <option selected>Flannel Plaid Shirt</option>
                            </select>
                        </div>
                    </fieldset>

                    <!-- Mid-page Promo Banner -->
                    <fieldset class="fieldset">
                        <legend class="legend">Banner Promo Tengah Halaman</legend>
                        <div><label class="form-label" for="promo-title">Judul</label><input type="text" id="promo-title" class="form-input" value="KAZUMI x BUSINESSWEEK"></div>
                        <div class="mt-4"><label class="form-label" for="promo-subtitle">Sub-judul</label><input type="text" id="promo-subtitle" class="form-input" value="Collaboration of The Year"></div>
                        <div class="mt-4"><label class="form-label" for="promo-offer">Teks Penawaran</label><input type="text" id="promo-offer" class="form-input" value="BUY 2 GET 30% OFF"></div>
                        <div class="mt-4">
                            <label class="form-label" for="promo-img">Gambar Latar</label>
                            <div class="flex items-center gap-4">
                                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-4.0.3&auto=format&fit=crop&w=160&q=80" class="h-16 w-32 object-cover rounded-md border">
                                <input type="file" id="promo-img" class="form-input">
                            </div>
                        </div>
                    </fieldset>

                    <div class="text-right">
                        <button type="submit" class="btn bg-[#6D4C41] hover:bg-[#4E342E] text-white text-lg">Simpan Semua Perubahan</button>
                        <p class="text-sm text-gray-500 mt-2">Catatan: Penyimpanan dinonaktifkan dalam versi statis ini.</p>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Image preview handler
            function setupFileInputListener(container) {
                const fileInput = container.querySelector('input[type="file"]');
                if (fileInput) {
                    fileInput.addEventListener('change', (event) => {
                        const file = event.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            const previewImage = event.target.closest('.flex').querySelector('img');

                            reader.onload = function(e) {
                                previewImage.src = e.target.result;
                            }
                            reader.readAsDataURL(file);
                        }
                    });
                }
            }

            document.querySelectorAll('input[type="file"]').forEach(input => {
                const container = input.closest('.flex');
                if(container) setupFileInputListener(container);
            });

            const sliderContainer = document.getElementById('slider-container');
            const addSlideBtn = document.querySelector('.btn.bg-gray-200');
            const mainForm = document.querySelector('form');

            // Delete slide handler
            sliderContainer.addEventListener('click', (e) => {
                if (e.target.textContent === 'Hapus Slide') {
                    e.target.closest('.border.p-4').remove();
                }
            });

            // Add new slide handler
            addSlideBtn.addEventListener('click', () => {
                const slideCount = sliderContainer.children.length + 1;
                const newSlide = document.createElement('div');
                newSlide.className = 'border p-4 rounded-md bg-gray-50 space-y-4';
                newSlide.innerHTML = `
                    <h4 class="font-bold">Slide ${slideCount}</h4>
                    <div><label class="form-label">Judul</label><input type="text" class="form-input" value=""></div>
                    <div><label class="form-label">Sub-judul</label><input type="text" class="form-input" value=""></div>
                    <div>
                        <label class="form-label">Gambar Latar</label>
                        <div class="flex items-center gap-4">
                            <img src="" class="h-16 w-32 object-cover rounded-md border bg-gray-200">
                            <input type="file" class="form-input">
                        </div>
                    </div>
                    <div class="text-right"><button type="button" class="text-sm text-red-600 hover:text-red-800 font-semibold">Hapus Slide</button></div>
                `;
                sliderContainer.appendChild(newSlide);
                setupFileInputListener(newSlide);
            });

            // Save Changes handler
            mainForm.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Perubahan telah disimpan! (Simulasi)');
            });
        });
    </script>
</body>
</html>
