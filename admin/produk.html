<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk - KAZUMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Montserrat', sans-serif; }
        .btn { display: inline-block; padding: 12px 30px; text-decoration: none; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .form-label { display: block; text-sm font-medium text-gray-700 mb-1; }
        .form-input { display: block; width: 100%; padding: 8px 12px; background-color: white; border: 1px solid #D1D5DB; border-radius: 6px; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-input:focus { border-color: #6D4C41; box-shadow: 0 0 0 3px rgba(109, 76, 65, 0.2); }
    </style>
</head>
<body class="font-sans text-[#333] bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-5">
            <div class="flex justify-between items-center py-4">
                <a href="../index.html" class="font-serif text-3xl font-bold text-[#6D4C41]">KAZUMI</a>
                <a href="../index.html" class="text-sm text-gray-600 hover:text-black">Kembali ke Situs Utama</a>
            </div>
        </div>
    </header>

    <main>
        <!-- Add/Edit Product Modal -->
        <div id="product-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-2xl">
                <h2 id="modal-title" class="text-2xl font-bold font-serif mb-6">Tambah Produk Baru</h2>
                <form id="product-form">
                    <input type="hidden" id="product-id" name="id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="product-name" class="form-label">Nama Produk</label>
                            <input type="text" id="product-name" name="name" class="form-input" required>
                        </div>
                        <div>
                            <label for="product-category" class="form-label">Kategori</label>
                            <select id="product-category" name="category" class="form-input">
                                <option>T-Shirt</option>
                                <option>Shirt</option>
                                <option>Pants</option>
                                <option>Jacket</option>
                                <option>Accessories</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-6">
                        <label for="product-price" class="form-label">Harga (IDR)</label>
                        <input type="number" id="product-price" name="price" class="form-input" required>
                    </div>
                    <div class="mt-6">
                        <label class="form-label">Gambar Produk</label>
                        <div class="flex items-center gap-4">
                            <img id="product-image-preview" src="" class="h-16 w-16 object-cover rounded-md border hidden">
                            <input type="file" id="product-image" name="image" class="form-input">
                        </div>
                    </div>
                    <div class="mt-6">
                        <label for="product-description" class="form-label">Deskripsi</label>
                        <textarea id="product-description" name="description" rows="3" class="form-input"></textarea>
                    </div>
                    <div class="flex justify-end gap-4 mt-8">
                        <button type="button" id="modal-cancel" class="btn bg-gray-200 hover:bg-gray-300 text-gray-800">Batal</button>
                        <button type="submit" class="btn bg-[#6D4C41] hover:bg-[#4E342E] text-white">Simpan</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="bg-gray-100 min-h-screen">
            <div class="container mx-auto px-5 py-10">
                <div class="text-center mb-12">
                    <h2 class="font-serif text-3xl md:text-4xl font-bold text-[#4E342E] relative inline-block">
                        Super Admin Panel
                        <span class="block w-16 h-1 bg-[#6D4C41] mx-auto mt-4"></span>
                    </h2>
                </div>
                <div class="flex flex-col md:flex-row gap-8">
                    <aside class="md:w-64">
                        <div class="bg-white p-4 rounded-lg shadow-xl sticky top-28">
                           <ul class="space-y-2">
                                <li>
                                    <a href="index.html" class="w-full flex items-center gap-3 p-3 rounded-md text-left transition-colors hover:bg-gray-100 text-gray-700">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
                                        <span>Dashboard</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="produk.html" class="w-full flex items-center gap-3 p-3 rounded-md text-left font-semibold transition-colors bg-[#6D4C41] text-white">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" /><path stroke-linecap="round" stroke-linejoin="round" d="M3.27 6.96L12 12.01l7.73-5.05M12 22.08V12" /></svg>
                                        <span>Kelola Produk</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="koleksi.html" class="w-full flex items-center gap-3 p-3 rounded-md text-left transition-colors hover:bg-gray-100 text-gray-700">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                          <path stroke-linecap="round" stroke-linejoin="round" d="M4.098 19.902a3.75 3.75 0 005.304 0l6.401-6.402a3.75 3.75 0 00-.625-6.25A3.75 3.75 0 006.75 7.5v.75m11.25 10.5a3.75 3.75 0 01-5.304 0l-6.401-6.402a3.75 3.75 0 01.625-6.25A3.75 3.75 0 0117.25 7.5v.75" />
                                        </svg>
                                        <span>Kelola Koleksi</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="pengaturan.html" class="w-full flex items-center gap-3 p-3 rounded-md text-left transition-colors hover:bg-gray-100 text-gray-700">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" /></svg>
                                        <span>Pengaturan</span>
                                    </a>
                                </li>
                           </ul>
                        </div>
                    </aside>
                    <main class="flex-1">
                        <div class="bg-white p-6 rounded-lg shadow-xl">
                            <div>
                                <div class="flex flex-col md:flex-row justify-between md:items-center mb-6 gap-4">
                                    <h3 class="font-serif text-2xl font-bold">Kelola Produk</h3>
                                    <div class="flex items-center gap-4">
                                        <div class="relative">
                                            <select id="category-filter" class="form-input !mt-0 !py-2 pl-3 pr-8">
                                                <option value="all">Semua Kategori</option>
                                                <option value="T-Shirt">T-Shirt</option>
                                                <option value="Shirt">Shirt</option>
                                                <option value="Pants">Pants</option>
                                                <option value="Jacket">Jacket</option>
                                            </select>
                                        </div>
                                        <button id="add-product-btn" class="btn bg-[#6D4C41] hover:bg-[#4E342E] text-white !py-2 !px-4 !text-sm flex items-center gap-2">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                                            Tambah Produk
                                        </button>
                                    </div>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead class="bg-gray-100">
                                            <tr><th class="p-3">Gambar</th><th class="p-3">Nama</th><th class="p-3">Kategori</th><th class="p-3">Harga</th><th class="p-3">Aksi</th></tr>
                                        </thead>
                                        <tbody id="product-table-body">
                                            <!-- Rows are generated by JavaScript -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </main>

    <script src="../data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('product-modal');
            const addProductBtn = document.getElementById('add-product-btn');
            const cancelBtn = document.getElementById('modal-cancel');
            const productForm = document.getElementById('product-form');
            const modalTitle = document.getElementById('modal-title');
            const categoryFilter = document.getElementById('category-filter');
            const productTableBody = document.getElementById('product-table-body');

            const idInput = document.getElementById('product-id');
            const nameInput = document.getElementById('product-name');
            const categoryInput = document.getElementById('product-category');
            const priceInput = document.getElementById('product-price');
            const imagePreview = document.getElementById('product-image-preview');
            const imageInput = document.getElementById('product-image');
            const descriptionInput = document.getElementById('product-description');

            let products = JSON.parse(localStorage.getItem('kazumiProducts'));

            function saveProducts() {
                localStorage.setItem('kazumiProducts', JSON.stringify(products));
            }

            function renderTable() {
                const selectedCategory = categoryFilter.value;
                productTableBody.innerHTML = '';

                products
                    .filter(p => selectedCategory === 'all' || p.category === selectedCategory)
                    .forEach(product => {
                        const row = document.createElement('tr');
                        row.className = 'border-b';
                        row.innerHTML = `
                            <td class="p-3"><img src="${product.image}" class="w-12 h-12 object-cover rounded-md"/></td>
                            <td class="p-3">${product.name}</td>
                            <td class="p-3">${product.category}</td>
                            <td class="p-3">IDR ${product.price.toLocaleString('id-ID')}</td>
                            <td class="p-3">
                                <div class="flex gap-2">
                                    <button class="edit-btn text-blue-500 hover:text-blue-700" data-id="${product.id}"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" /></svg></button>
                                    <button class="delete-btn text-red-500 hover:text-red-700" data-id="${product.id}"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg></button>
                                </div>
                            </td>
                        `;
                        productTableBody.appendChild(row);
                    });
            }

            function openModal() { modal.classList.remove('hidden'); }
            function closeModal() { modal.classList.add('hidden'); }

            addProductBtn.addEventListener('click', () => {
                modalTitle.textContent = 'Tambah Produk Baru';
                productForm.reset();
                idInput.value = '';
                imagePreview.classList.add('hidden');
                imagePreview.src = '';
                openModal();
            });

            productTableBody.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.edit-btn');
                const deleteBtn = e.target.closest('.delete-btn');

                if (editBtn) {
                    modalTitle.textContent = 'Edit Produk';
                    const productId = editBtn.dataset.id;
                    const product = products.find(p => p.id === productId);

                    idInput.value = product.id;
                    nameInput.value = product.name;
                    categoryInput.value = product.category;
                    priceInput.value = product.price;
                    descriptionInput.value = product.description;
                    imagePreview.src = product.image;
                    imagePreview.classList.remove('hidden');

                    openModal();
                }

                if (deleteBtn) {
                    if (confirm('Anda yakin ingin menghapus produk ini?')) {
                        const productId = deleteBtn.dataset.id;
                        products = products.filter(p => p.id !== productId);
                        saveProducts();
                        renderTable();
                    }
                }
            });

            categoryFilter.addEventListener('change', renderTable);
            cancelBtn.addEventListener('click', closeModal);

            productForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = idInput.value;
                const newProductData = {
                    name: nameInput.value,
                    category: categoryInput.value,
                    price: parseInt(priceInput.value, 10),
                    description: descriptionInput.value,
                    image: imagePreview.src, // In a real app, you'd handle file upload
                    images: imagePreview.src ? [imagePreview.src] : [],
                    sizes: ['S', 'M', 'L', 'XL'] // Default sizes for new products
                };

                if (id) { // Editing existing product
                    const index = products.findIndex(p => p.id === id);
                    products[index] = { ...products[index], ...newProductData };
                } else { // Adding new product
                    newProductData.id = Date.now().toString();
                    products.push(newProductData);
                }

                saveProducts();
                renderTable();
                alert('Produk telah disimpan!');
                closeModal();
            });

            imageInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        imagePreview.classList.remove('hidden');
                    }
                    reader.readAsDataURL(file);
                }
            });

            renderTable();
        });
    </script>
</body>
</html>
